.lang{display:flex;gap:2px}
.lang button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;background:none;border:0;padding:8px 7px;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:4px}

.kick{margin-top:clamp(40px,9vh,88px);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
h1{margin-top:10px;font-size:clamp(60px,18vw,112px);line-height:.9;letter-spacing:var(--tr-xl);margin-left:-.03em}
.sub{margin-top:16px;font-size:18px;color:var(--mute);max-width:30ch}

/* Roles: one tap = checked in */
.roles{margin-top:clamp(24px,4vh,36px);border-bottom:1px solid var(--rule)}
.role{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:clamp(60px,8.6vh,72px);margin:0;padding:6px 2px;background:none;border:0;border-top:1px solid var(--rule);border-radius:0;color:var(--fg);font:inherit;font-size:clamp(26px,7.6vw,34px);line-height:1.05;letter-spacing:var(--tr-l);text-align:left;cursor:pointer;transition:background-color .15s,color .15s,padding .2s,opacity .2s}
.role .ar{flex:none;color:var(--orange);font-size:.8em;transition:transform .2s}
@media (hover:hover){.role:hover{color:var(--orange)}.role:hover .ar{transform:translateX(4px)}}
.role:active,.role.on{background:var(--orange);color:#fff;padding-left:14px;padding-right:14px}
.role.on .ar,.role:active .ar{color:#fff}
.role.on .ar{animation:wait 1s ease-in-out infinite}
.role[disabled]{opacity:.32;cursor:default}
.role[disabled]:hover{color:var(--fg)}
@keyframes wait{50%{opacity:.25}}

/* Done */
.dot{display:block;width:clamp(44px,12vw,64px);aspect-ratio:1;border-radius:50%;background:var(--orange);margin-top:clamp(40px,9vh,88px);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
#done .kick{margin-top:28px}
.you{margin-top:22px;font-size:18px;color:var(--mute)}
.you b{display:block;margin-top:6px;font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1;letter-spacing:var(--tr-l);color:var(--orange)}
.count{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:20px;line-height:1.3;max-width:26ch}
.count:empty{display:none}
.acts{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.acts a{font-size:16px;font-weight:700;color:var(--orange);padding:8px 0}

.again{margin-top:48px;font:inherit;font-size:14px;background:#1b1b1b;border:0;padding:10px 14px;color:var(--mute);cursor:pointer}
.net{margin-top:22px;padding:14px 16px;background:#1b1b1b;border-left:3px solid var(--orange);font-size:16px;line-height:1.35}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  :root{--gap:16px;--pad:max(16px,env(safe-area-inset-left,0px));--padr:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cols i:nth-child(n+5){display:none}
}
@media (max-width:359px){.role{font-size:24px}}

<main class="w">
  <div class="top">
    <a class="logo" href="/" aria-label="TAS3D"></a>
    <div class="lang" role="group" aria-label="Язык / Language / Til">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <section id="ask">
    <p class="kick" data-k="kick">TAS3D 2026 · отметка в зале</p>
    <h1 data-k="h">Кто вы?</h1>
    <p class="sub" data-k="sub">Нажмите один вариант, и вы отмечены. Имя не нужно.</p>
    <div class="roles" id="roles"></div>
  </section>

  <section id="done" hidden>
    <span class="dot" aria-hidden="true"></span>
    <p class="kick" data-k="dkick">Вы отмечены</p>
    <h1 data-k="thanks" tabindex="-1">Спасибо!</h1>
    <p class="you"><span data-k="you">Ваш ответ</span><b id="myrole"></b></p>
    <p class="count" id="count"></p>
    <div class="acts">
      <a href="/" id="site" data-k="site">Сайт форума →</a>
    </div>
    <button type="button" class="again" id="again" hidden>Тест: отметиться ещё раз как новый гость</button>
  </section>

  <p class="net" id="net" role="status" aria-live="polite" hidden></p>

<script>
// TAS3D 2026 — check-in by QR. Shared settings for /hi/ (guests' phones) and /live/ (the screen on stage).
// No server of our own: check-ins go through free public MQTT brokers (no account, no keys).
// A phone sends its answer to every broker at once; the screen listens to all of them, so one broker being down is fine.
// Each answer is kept on the broker ("retained"), so the screen gets everything back after a reload.
// room: random part of the topic, so other people's tests on these public brokers do not mix with ours.
// roles: [key, RU, EN, UZ].
window.TAS3D_CHECKIN = {
  room: '24s57u4s6z',
  topic: 'testtopic/tas3d2026',
  // Checked from Tashkent on 06.11.2026: both EMQX addresses work; HiveMQ and Mosquitto did not open there (kept as spares).
  brokers: [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker-cn.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ],
  roles: [
    ['vis', 'Визуализатор', 'Visualiser', 'Vizualizator'],
    ['arch', 'Архитектор', 'Architect', 'Arxitektor'],
    ['dev', 'Девелопер', 'Developer', 'Developer'],
    ['stud', 'Студент', 'Student', 'Talaba'],
    ['teach', 'Учитель', 'Teacher', 'O‘qituvchi'],
    ['other', 'Другое', 'Other', 'Boshqa']
  ]
};
// For tests: ?broker=ws://localhost:9001/mqtt (comma-separated) replaces the list above.
(function (c) {
  try {
    var b = new URLSearchParams(location.search).get('broker');
    if (b) c.brokers = b.split(',').filter(function (u) { return /^wss?:\/\//.test(u); });
  } catch (e) {}
  c.base = c.topic + '/' + c.room;      // <base>/c/<phone id> = answer of one phone, <base>/s = total for phones
})(window.TAS3D_CHECKIN);
</script>
<script>
// TAS3D — tiny MQTT 3.1.1 client over WebSocket (just what check-in needs: connect, subscribe, publish QoS 0/1, retain, ping).
// new TasMQ(url, { onConnect(), onMessage(topic, text, retained), onClose() }); .connect() .subscribe(filter) .publish(topic, text, {qos, retain}) → Promise .close()
(function () {
  var enc = new TextEncoder(), dec = new TextDecoder();
  function u16(n) { return [(n >> 8) & 255, n & 255]; }
  function str(s) { var b = enc.encode(s); return u16(b.length).concat(Array.prototype.slice.call(b)); }
  function len(n) { var out = []; do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; }
  function pack(head, body) { return new Uint8Array([head].concat(len(body.length), body)); }
  function cat(a, b) { var c = new Uint8Array(a.length + b.length); c.set(a, 0); c.set(b, a.length); return c; }

  function TasMQ(url, o) {
    this.url = url; this.o = o || {}; this.ws = null; this.ok = false;
    this.buf = new Uint8Array(0); this.pid = 1; this.wait = {}; this.ping = null;
    this.id = 'tas3d' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
  }
  TasMQ.prototype.connect = function () {
    var me = this, ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { setTimeout(function () { me._closed(); }, 0); return this; }
    this.ws = ws; ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      // CONNECT: protocol "MQTT", level 4, clean session, keep-alive 30 s
      ws.send(pack(0x10, str('MQTT').concat([4, 0x02], u16(30), str(me.id))));
    };
    ws.onmessage = function (e) { if (e.data instanceof ArrayBuffer) me._feed(new Uint8Array(e.data)); };
    ws.onerror = function () {};
    ws.onclose = function () { me._closed(); };
    return this;
  };
  TasMQ.prototype._closed = function () {
    if (this.dead) return;
    this.dead = true; this.ok = false; clearInterval(this.ping);
    for (var k in this.wait) { this.wait[k][1](new Error('closed')); }
    this.wait = {};
    if (this.o.onClose) this.o.onClose();
  };
  TasMQ.prototype._send = function (bytes) { if (this.ws && this.ws.readyState === 1) { this.ws.send(bytes); return true; } return false; };
  TasMQ.prototype._feed = function (chunk) {
    this.buf = cat(this.buf, chunk);
    while (this.buf.length >= 2) {
      var mul = 1, n = 0, i = 1, d;
      do { if (i >= this.buf.length) return; d = this.buf[i++]; n += (d & 127) * mul; mul *= 128; } while (d & 128 && i < 5);
      if (this.buf.length < i + n) return;
      var head = this.buf[0], body = this.buf.subarray(i, i + n);
      this.buf = this.buf.slice(i + n);
      this._packet(head, body);
    }
  };
  TasMQ.prototype._packet = function (head, b) {
    var me = this, type = head >> 4;
    if (type === 2) {                                   // CONNACK
      if (b[1] === 0) {
        this.ok = true;
        this.ping = setInterval(function () { me._send(new Uint8Array([0xC0, 0])); }, 20000);
        if (this.o.onConnect) this.o.onConnect();
      } else this.close();
    } else if (type === 3) {                            // PUBLISH from the broker
      var qos = (head >> 1) & 3, tl = (b[0] << 8) | b[1], topic = dec.decode(b.subarray(2, 2 + tl)), p = 2 + tl;
      if (qos > 0) { var id = (b[p] << 8) | b[p + 1]; p += 2; if (qos === 1) this._send(pack(0x40, [b[p - 2], b[p - 1]])); }
      if (this.o.onMessage) this.o.onMessage(topic, dec.decode(b.subarray(p)), !!(head & 1));
    } else if (type === 4) {                            // PUBACK
      var k = (b[0] << 8) | b[1], w = this.wait[k];
      if (w) { delete this.wait[k]; w[0](); }
    }
    // SUBACK (9) and PINGRESP (13) need nothing
  };
  TasMQ.prototype._next = function () { this.pid = this.pid % 65535 + 1; return this.pid; };
  TasMQ.prototype.subscribe = function (filter) {
    return this._send(pack(0x82, u16(this._next()).concat(str(filter), [0])));
  };
  TasMQ.prototype.publish = function (topic, text, opt) {
    var me = this, qos = opt && opt.qos ? 1 : 0, retain = opt && opt.retain ? 1 : 0;
    var body = str(topic), id = 0;
    if (qos) { id = this._next(); body = body.concat(u16(id)); }
    body = body.concat(Array.prototype.slice.call(enc.encode(text || '')));
    var bytes = pack(0x30 | (qos << 1) | retain, body);
    if (!qos) return Promise.resolve(this._send(bytes));
    return new Promise(function (ok, no) {
      me.wait[id] = [ok, no];
      if (!me._send(bytes)) { delete me.wait[id]; no(new Error('not connected')); }
    });
  };
  TasMQ.prototype.close = function () {
    try { this._send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) {}
    this._closed();
  };
  window.TasMQ = TasMQ;
})();
</script>
<script>
(function () {
  var C = window.TAS3D_CHECKIN || { brokers: [], roles: [] };
  var Q = new URLSearchParams(location.search);
  var TEST = location.protocol === 'file:';   // the "new guest" button, only in the file for trying it on one computer
  var LI = { ru: 1, en: 2, uz: 3 };    // column of the role name in C.roles
  var T = {
    ru: { title: 'Отметка — TAS3D 2026', kick: 'TAS3D 2026 · отметка в зале', h: 'Кто вы?', sub: 'Нажмите один вариант, и вы отмечены. Имя не нужно.',
      dkick: 'Вы отмечены', thanks: 'Спасибо!', you: 'Ваш ответ', site: 'Сайт форума →',
      count: function (n) { return 'Нас уже ' + n + '. Смотрите на экран.'; }, look: 'Смотрите на экран.',
      offline: 'Нет связи. Отметка отправится сама, когда появится интернет. Не закрывайте страницу.' },
    en: { title: 'Check-in — TAS3D 2026', kick: 'TAS3D 2026 · check-in', h: 'Who are you?', sub: 'Tap one option and you are checked in. No name needed.',
      dkick: 'You are checked in', thanks: 'Thank you!', you: 'Your answer', site: 'Forum website →',
      count: function (n) { return n + (n === 1 ? ' person has' : ' people have') + ' checked in. Look at the screen.'; }, look: 'Look at the screen.',
      offline: 'No connection. Your check-in will be sent as soon as you are back online. Keep this page open.' },
    uz: { title: 'Belgilanish — TAS3D 2026', kick: 'TAS3D 2026 · zalda belgilanish', h: 'Siz kimsiz?', sub: 'Bitta variantni bosing va siz belgilanasiz. Ism shart emas.',
      dkick: 'Siz belgilandingiz', thanks: 'Rahmat!', you: 'Javobingiz', site: 'Forum sayti →',
      count: function (n) { return 'Allaqachon ' + n + ' kishi belgilandi. Ekranga qarang.'; }, look: 'Ekranga qarang.',
      offline: 'Aloqa yo‘q. Internet paydo bo‘lishi bilan belgi o‘zi yuboriladi. Sahifani yopmang.' }
  };
  var KEY = 'tas3d-checkin-' + C.room;
  var $ = function (id) { return document.getElementById(id); };
  var lang = 'ru', view = 'ask';

  // ---- saved state on this phone: one check-in per phone, the answer cannot be changed
  var st = null;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!st || !/^[a-z0-9]{12,40}$/.test(st.id || '')) st = fresh();
  function fresh() { return { id: newId(), role: '', sent: false }; }
  function newId() {
    var a = new Uint8Array(12), s = '';
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < a.length; i++) s += (a[i] % 36).toString(36);
    return s + Date.now().toString(36);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  save();

  // ---- language: ?lang=…, then the one chosen on the site, then the phone's language; Russian by default
  var q = Q.get('lang'), saved = null;
  try { saved = localStorage.getItem('tas3d-lang'); } catch (e) {}
  var nav = (navigator.language || '').slice(0, 2).toLowerCase();
  lang = T[q] ? q : T[saved] ? saved : nav === 'uz' ? 'uz' : 'ru';

  function name(key) {
    for (var i = 0; i < C.roles.length; i++) if (C.roles[i][0] === key) return C.roles[i][LI[lang]];
    return '';
  }
  function home(l) { return (location.hostname === 'tas3d.uz' ? '' : 'https://tas3d.uz') + (l === 'ru' ? '/' : '/' + l + '/'); }   // the page may live outside the site (e.g. pages.dev)
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.title = T[l].title;
    document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = T[l][el.getAttribute('data-k')]; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === l ? 'true' : 'false'); });
    $('site').setAttribute('href', home(l));
    document.querySelector('.logo').setAttribute('href', home(l));
    try { localStorage.setItem('tas3d-lang', l); } catch (e) {}
    render();
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });

  // ---- role buttons
  var box = $('roles');
  C.roles.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'role'; b.setAttribute('data-r', r[0]);
    b.innerHTML = '<span class="nm"></span><span class="ar" aria-hidden="true">→</span>';
    b.addEventListener('click', function () { choose(r[0]); });
    box.appendChild(b);
  });

  var net = { k: '' };
  function render() {
    var sending = st.role && !st.sent;
    box.querySelectorAll('.role').forEach(function (b) {
      var k = b.getAttribute('data-r');
      b.querySelector('.nm').textContent = name(k);
      b.classList.toggle('on', !!sending && st.role === k);
      b.disabled = !!sending && st.role !== k;
      if (sending && st.role === k) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
    });
    $('ask').hidden = view !== 'ask';
    $('done').hidden = view !== 'done';
    $('again').hidden = !TEST;
    $('myrole').textContent = name(st.role);
    $('count').textContent = typeof st.total === 'number' && st.total > 0 ? T[lang].count(st.total) : T[lang].look;
    var el = $('net');
    el.textContent = net.k ? T[lang][net.k] : '';
    el.hidden = !net.k;
  }
  function show(v) {
    view = v; render();
    if (v === 'done') { try { $('done').querySelector('h1').focus({ preventScroll: true }); } catch (e) {} window.scrollTo(0, 0); }
  }

  // ---- sending to every broker at once; done when one of them confirms. Retries until it goes through.
  var attempt = 0, timer = null, busy = false;
  function choose(role) {
    if (st.role) return;                          // this phone has already chosen (or is sending)
    st.role = role; st.sent = false; st.t = Date.now(); st.total = undefined; save();
    attempt = 0; render(); go();
  }
  function go() {
    clearTimeout(timer);
    if (busy || !st.role || st.sent) return;
    busy = true; attempt++;
    var role = st.role;
    send(role).then(function () {
      busy = false;
      if (st.role !== role) return go();
      st.sent = true; save();
      net.k = '';
      show('done');
    }).catch(function () {
      busy = false;
      if (attempt >= 2) { net.k = 'offline'; render(); }
      var wait = [1500, 3000, 5000, 8000][attempt - 1] || 10000;
      timer = setTimeout(go, wait + Math.random() * 1000);
    });
  }
  window.addEventListener('online', function () { attempt = Math.min(attempt, 1); go(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) return; go(); if (st.sent) peek(); });

  // the screen was reset ("Сбросить"): an answer given before that no longer counts, the buttons come back
  function onRound(text) {
    var at = 0; try { at = +JSON.parse(text).at || 0; } catch (e) {}
    if (!at || !st.role || (st.t || 0) >= at) return;
    clearTimeout(timer); attempt = 0;
    st = fresh(); save(); net.k = ''; show('ask');
  }
  function onMsg(t, text) {
    if (t === C.base + '/s') onStats(text);
    else if (t === C.base + '/r') onRound(text);
  }
  function onStats(text) {
    try { var d = JSON.parse(text); if (typeof d.n === 'number') { st.total = d.n; save(); render(); } } catch (e) {}
  }
  function send(role) {
    var topic = C.base + '/c/' + st.id;
    var msg = JSON.stringify({ r: role, l: lang, t: st.t || Date.now() });
    return new Promise(function (ok, no) {
      var settled = false, left = C.brokers.length, all = [];
      if (!left) return no(new Error('no brokers'));
      var to = setTimeout(function () { end(false); }, 12000);
      function end(success) {
        if (settled) return;
        settled = true; clearTimeout(to);
        if (success) { ok(); setTimeout(closeAll, 6000); }   // the other brokers get a few more seconds, the total may still arrive
        else { closeAll(); no(new Error('not sent')); }
      }
      function closeAll() { all.forEach(function (c) { c.close(); }); }
      C.brokers.forEach(function (url) {
        var c = new TasMQ(url, {
          onConnect: function () {
            c.publish(topic, msg, { qos: 1, retain: true }).then(function () {
              if (!settled) { c.subscribe(C.base + '/s'); c.subscribe(C.base + '/r'); }
              end(true);
            }, function () {});
          },
          onMessage: onMsg,
          onClose: function () { left--; if (left <= 0) end(false); }
        });
        all.push(c);
        c.connect();
      });
    });
  }
  // the total from the screen, once (when the page is opened again later)
  var peeking = false;
  function peek() {
    if (peeking) return;
    peeking = true; setTimeout(function () { peeking = false; }, 6000);
    C.brokers.slice(0, 2).forEach(function (url) {
      var c = new TasMQ(url, {
        onConnect: function () { c.subscribe(C.base + '/r'); c.subscribe(C.base + '/s'); },
        onMessage: onMsg
      });
      c.connect();
      setTimeout(function () { c.close(); }, 5000);
    });
  }

  $('again').addEventListener('click', function () {
    st = fresh(); save(); net.k = ''; show('ask');
  });

  // ---- start
  setLang(lang);
  if (st.role && st.sent) { show('done'); peek(); }
  else if (st.role) go();                         // a check-in that did not go through last time
})();
</script>
