body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"HelvTAS",Helvetica,Arial,sans-serif;line-height:1.3;-webkit-font-smoothing:antialiased;font-kerning:normal;text-rendering:optimizeLegibility}
body.idle,body.idle *{cursor:none}
p,h1,h2{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.cols{position:fixed;inset:0;padding:0 var(--pad);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);pointer-events:none;z-index:0}
.cols i{border-left:1px solid var(--line);border-right:1px solid var(--line)}

.meta{display:flex;align-items:center;gap:1.6rem;font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
.live{display:flex;align-items:center;gap:.6rem;color:var(--fg)}
.live i{width:.75rem;height:.75rem;border-radius:50%;background:var(--orange);animation:beat 2s ease-in-out infinite}
.live.off{color:var(--mute)}
.live.off i{background:var(--mute);animation:none}
@keyframes beat{50%{opacity:.3}}

/* QR column */
.qr{grid-column:1/6;grid-row:2;align-self:end;display:flex;flex-direction:column}
.qr img{display:block;width:min(100%,62vh);height:auto;aspect-ratio:1;background:#fff}
.qr h2{margin-top:2rem;font-size:4.6rem;line-height:.95;letter-spacing:var(--tr-xl)}
.qr p{margin-top:.9rem;font-size:1.5rem;color:var(--mute)}
.qr p b{color:var(--orange);font-weight:700;white-space:nowrap}

/* Count */
.main{grid-column:6/13;grid-row:2;align-self:end;display:flex;flex-direction:column;min-width:0}
.lbl{font-size:1.25rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
.total{display:flex;margin:1.4rem 0 0 -.05em;font-size:14.5rem;line-height:.8;letter-spacing:var(--tr-xl);perspective:3em;white-space:nowrap}
.total span{display:inline-block;transform-origin:50% 55%;backface-visibility:hidden}
.total span.flip{animation:flip .55s cubic-bezier(.2,.7,.3,1)}
@keyframes flip{from{transform:rotateX(-90deg);opacity:.25}}

.rows{margin-top:2.6rem;border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:14.5rem minmax(0,1fr) 5.4rem 4.2rem;align-items:center;column-gap:1.4rem;height:4.9rem;border-top:1px solid var(--rule)}
.row .nm{font-size:2.05rem;letter-spacing:var(--tr-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{position:relative;height:1.05rem;background:var(--track)}
.row .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--fg);transition:width .9s cubic-bezier(.2,.8,.2,1),background-color .4s}
.row .n{font-size:2.5rem;text-align:right;letter-spacing:var(--tr-m);transition:color .4s}
.row .pc{font-size:1.35rem;text-align:right;color:var(--mute)}
.row.lead .bar i{background:var(--orange)}
.row.lead .n{color:var(--orange)}
.row.bump .n{animation:bump .7s ease-out}
@keyframes bump{from{transform:translateY(-.25em);color:var(--orange)}}

/* Without QR: the big number takes the left side */
html.noqr .qr{display:none}
html.noqr .main{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:end}
html.noqr .head{grid-column:1/6}
html.noqr .total{font-size:23rem;padding-bottom:.08em}
html.noqr .rows{grid-column:6/13;margin-top:0}
html.noqr .row{height:6.4rem;grid-template-columns:17.5rem minmax(0,1fr) 6rem 4.4rem}
html.noqr .row .nm{font-size:2.4rem}

/* Controls: appear when the mouse moves */
.ctl{position:fixed;left:50%;top:2.25rem;transform:translateX(-50%);z-index:2;display:flex;gap:.3rem;transition:opacity .4s}
body.idle .ctl{opacity:0;pointer-events:none}
.ctl button{font:inherit;font-size:max(12px,.85rem);font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:#1b1b1b;color:var(--mute);border:0;padding:.5rem .8rem;cursor:pointer}
.ctl button:hover{color:var(--fg)}
.ctl button[aria-pressed="true"]{color:var(--fg)}


/* poll results */
.pq{margin-top:1.2rem;font-size:4.2rem;line-height:1;letter-spacing:var(--tr-l)}
.pk{color:var(--orange)}
.prows .row{grid-template-columns:minmax(0,19rem) minmax(0,1fr) 5.4rem 4.2rem;min-height:4.9rem;height:auto;padding:.6rem 0}
.prows .row .nm{white-space:normal;line-height:1.05;font-size:1.95rem}
.pn{margin-top:1.2rem;font-size:1.35rem;color:var(--mute)}
html.noqr .main.pollv{display:flex}
html.noqr .main.pollv .rows{margin-top:2.6rem}

/* reactions and the question card on top of everything */
.rx{position:fixed;bottom:-12vh;z-index:5;font-size:4.4rem;line-height:1;pointer-events:none;will-change:transform,opacity;animation:rise var(--d,3.6s) cubic-bezier(.25,.6,.35,1) forwards;filter:drop-shadow(0 .06em .12em rgba(0,0,0,.35))}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1;transform:translate(calc(var(--s) * .3),-12vh) scale(1)}50%{transform:translate(calc(var(--s) * -1),-40vh) scale(1.05)}80%{opacity:.9}100%{transform:translate(var(--s),-66vh) scale(1.1);opacity:0}}
.card{position:fixed;left:3vw;bottom:5vh;z-index:4;max-width:min(52vw,1000px);padding:1.9rem 2.3rem 2.1rem;background:rgba(14,14,14,.96);border-left:.45rem solid var(--orange);box-shadow:0 1rem 3rem rgba(0,0,0,.45);transform:translateX(-120%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.card.on{transform:none;opacity:1}
.card .k{font-size:max(12px,.95rem);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange)}
.card .t{margin-top:.7rem;font-size:max(22px,2.5rem);line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}

/* password */
#login{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#login .in{width:min(420px,90vw);font-size:16px}
#login h1{margin-top:28px;font-size:56px;line-height:.9;letter-spacing:-.02em;font-weight:400}
#login input{display:block;width:100%;margin-top:24px;min-height:54px;padding:0 16px;background:#171716;border:1px solid #2c2c2b;color:var(--fg);font:inherit;font-size:19px}
#login input:focus{outline:none;border-color:var(--orange)}
#login button{margin-top:12px;width:100%;min-height:54px;background:var(--orange);color:#fff;border:0;font:inherit;font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
#login .err{margin-top:12px;min-height:22px;color:var(--orange);font-weight:700}
#login .logo{width:110px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Opened on a phone: stack everything */
@media (max-aspect-ratio:1/1){
  html{font-size:2.4vw}
  body{height:auto;overflow:auto}
  .stage{height:auto;grid-template-rows:auto auto auto;row-gap:5rem}
  .qr,.main{grid-column:1/-1}
  .qr{grid-row:2}
  .main{grid-row:3}
  .qr img{width:100%}
  .row{grid-template-columns:16rem minmax(0,1fr) 6rem 5rem;height:7rem}
  .row .nm{font-size:3rem}.row .n{font-size:3.4rem}.row .pc{font-size:2rem}
  html.noqr .main{display:flex}
}
</style>
</head>

  <button type="submit">Open the screen</button>
  <p class="err" role="alert"></p>

<script>
// TAS3D — tiny MQTT 3.1.1 client over WebSocket (just what check-in needs: connect, subscribe, publish QoS 0/1, retain, ping).
// new TasMQ(url, { onConnect(), onMessage(topic, text, retained), onClose() }); .connect() .subscribe(filter, qos) .publish(topic, text, {qos, retain}) → Promise .close()
(function () {
  var enc = new TextEncoder(), dec = new TextDecoder();
  function u16(n) { return [(n >> 8) & 255, n & 255]; }
  function str(s) { var b = enc.encode(s); return u16(b.length).concat(Array.prototype.slice.call(b)); }
  function len(n) { var out = []; do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; }
  function pack(head, body) { return new Uint8Array([head].concat(len(body.length), body)); }
  function cat(a, b) { var c = new Uint8Array(a.length + b.length); c.set(a, 0); c.set(b, a.length); return c; }

  function TasMQ(url, o) {
    this.url = url; this.o = o || {}; this.ws = null; this.ok = false;
    this.buf = new Uint8Array(0); this.pid = 1; this.wait = {}; this.ping = null;
    this.id = 'tas3d' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
  }
  TasMQ.prototype.connect = function () {
    var me = this, ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { setTimeout(function () { me._closed(); }, 0); return this; }
    this.ws = ws; ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      // CONNECT: protocol "MQTT", level 4, clean session, keep-alive 30 s
      ws.send(pack(0x10, str('MQTT').concat([4, 0x02], u16(30), str(me.id))));
    };
    ws.onmessage = function (e) { if (e.data instanceof ArrayBuffer) me._feed(new Uint8Array(e.data)); };
    ws.onerror = function () {};
    ws.onclose = function () { me._closed(); };
    return this;
  };
  TasMQ.prototype._closed = function () {
    if (this.dead) return;
    this.dead = true; this.ok = false; clearInterval(this.ping);
    for (var k in this.wait) { this.wait[k][1](new Error('closed')); }
    this.wait = {};
    if (this.o.onClose) this.o.onClose();
  };
  TasMQ.prototype._send = function (bytes) { if (this.ws && this.ws.readyState === 1) { this.ws.send(bytes); return true; } return false; };
  TasMQ.prototype._feed = function (chunk) {
    this.buf = cat(this.buf, chunk);
    while (this.buf.length >= 2) {
      var mul = 1, n = 0, i = 1, d;
      do { if (i >= this.buf.length) return; d = this.buf[i++]; n += (d & 127) * mul; mul *= 128; } while (d & 128 && i < 5);
      if (this.buf.length < i + n) return;
      var head = this.buf[0], body = this.buf.subarray(i, i + n);
      this.buf = this.buf.slice(i + n);
      this._packet(head, body);
    }
  };
  TasMQ.prototype._packet = function (head, b) {
    var me = this, type = head >> 4;
    if (type === 2) {                                   // CONNACK
      if (b[1] === 0) {
        this.ok = true;
        this.ping = setInterval(function () { me._send(new Uint8Array([0xC0, 0])); }, 20000);
        if (this.o.onConnect) this.o.onConnect();
      } else this.close();
    } else if (type === 3) {                            // PUBLISH from the broker
      var qos = (head >> 1) & 3, tl = (b[0] << 8) | b[1], topic = dec.decode(b.subarray(2, 2 + tl)), p = 2 + tl;
      if (qos > 0) { var id = (b[p] << 8) | b[p + 1]; p += 2; if (qos === 1) this._send(pack(0x40, [b[p - 2], b[p - 1]])); }
      if (this.o.onMessage) this.o.onMessage(topic, dec.decode(b.subarray(p)), !!(head & 1));
    } else if (type === 4) {                            // PUBACK
      var k = (b[0] << 8) | b[1], w = this.wait[k];
      if (w) { delete this.wait[k]; w[0](); }
    }
    // SUBACK (9) and PINGRESP (13) need nothing
  };
  TasMQ.prototype._next = function () { this.pid = this.pid % 65535 + 1; return this.pid; };
  TasMQ.prototype.subscribe = function (filter, qos) {    // qos 1: the broker queues messages for us instead of dropping them under load
    return this._send(pack(0x82, u16(this._next()).concat(str(filter), [qos ? 1 : 0])));
  };
  TasMQ.prototype.publish = function (topic, text, opt) {
    var me = this, qos = opt && opt.qos ? 1 : 0, retain = opt && opt.retain ? 1 : 0;
    var body = str(topic), id = 0;
    if (qos) { id = this._next(); body = body.concat(u16(id)); }
    body = body.concat(Array.prototype.slice.call(enc.encode(text || '')));
    var bytes = pack(0x30 | (qos << 1) | retain, body);
    if (!qos) return Promise.resolve(this._send(bytes));
    return new Promise(function (ok, no) {
      me.wait[id] = [ok, no];
      if (!me._send(bytes)) { delete me.wait[id]; no(new Error('not connected')); }
    });
  };
  TasMQ.prototype.close = function () {
    try { this._send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) {}
    this._closed();
  };
  window.TasMQ = TasMQ;
})();
</script>
<script>
// TAS3D 2026 — the host side, shared by host/ (the host panel) and screen/ (the projector).
// Keeps the live picture from the MQTT brokers: check-ins of the current round, questions, the poll and its votes,
// the question shown over the slides, reactions. The host panel also changes it (Reset, polls, questions).
// Needs config.js and mqtt.js. Usage: var hub = TasHub(onChange, {onReact}); hub.state ...; hub.reset() ...
(function () {
  var C = window.TAS3D_CHECKIN;

  // ---------- password (only its salted hash is in config.js) ----------
  var AUTH = 'tas3d-host-' + C.room;
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function unhex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  window.TasAuth = {
    ok: function () {
      try { var a = JSON.parse(localStorage.getItem(AUTH) || 'null'); return !!(a && a.h === C.host.hash && a.until > Date.now()); } catch (e) { return false; }
    },
    check: function (pass) {
      if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('This browser cannot check the password here.'));
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']).then(function (key) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(C.host.salt), iterations: C.host.iterations }, key, 256);
      }).then(function (bits) {
        var good = hex(bits) === C.host.hash;
        if (good) try { localStorage.setItem(AUTH, JSON.stringify({ h: C.host.hash, until: Date.now() + 24 * 3600 * 1000 })); } catch (e) {}
        return good;
      });
    },
    logout: function () { try { localStorage.removeItem(AUTH); } catch (e) {} },
    // shows the password form (#login) until the right password is typed, then calls go()
    gate: function (go) {
      var form = document.getElementById('login');
      if (TasAuth.ok()) { form.hidden = true; return go(); }
      form.hidden = false;
      var input = form.querySelector('input'), err = form.querySelector('.err'), btn = form.querySelector('button');
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!input.value) return;
        btn.disabled = true; err.textContent = '';
        TasAuth.check(input.value).then(function (good) {
          btn.disabled = false;
          if (good) { form.hidden = true; input.value = ''; go(); }
          else { err.textContent = 'Wrong password.'; input.select(); }
        }, function (x) { btn.disabled = false; err.textContent = x.message; });
      });
    }
  };

  // ---------- the hub ----------
  window.TasHub = function (onChange, opt) {
    opt = opt || {};
    var B = C.base, ROLE = {}, KEY = 'tas3d-live2-' + C.room;
    C.roles.forEach(function (r) { ROLE[r[0]] = 1; });
    var S = {
      db: { seen: {}, round: '0', at: 0 },   // check-ins of the current round: phone id -> {r, t}
      qs: {},                                // questions: id -> {q, t, g}
      done: {},                              // questions removed here
      show: '',                              // the question shown over the slides
      now: null,                             // the current poll {k, id, q, o, open, at}
      votes: {},                             // phone id -> {o, t} for the current poll
      rx: {},                                // reactions since this page was opened
      total: 0, counts: {}, pollCounts: [], pollTotal: 0
    };
    C.reactions.forEach(function (r) { S.rx[r[0]] = 0; });
    try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv && sv.seen && typeof sv.round === 'string') S.db = sv; } catch (e) {}
    try { var dn = JSON.parse(localStorage.getItem(KEY + '-done') || 'null'); if (dn) S.done = dn; } catch (e) {}

    var changeT = null;
    function changed() { if (!changeT) changeT = setTimeout(function () { changeT = null; onChange(S); }, 30); }
    function store() { try { localStorage.setItem(KEY, JSON.stringify(S.db)); localStorage.setItem(KEY + '-done', JSON.stringify(S.done)); } catch (e) {} }

    // ---- connections to every broker, each reconnects by itself
    var links = [];
    function subsFor(c) {
      c.subscribe(B + '/r', 1); c.subscribe(B + '/c/+', 1); c.subscribe(B + '/q/+', 1);
      c.subscribe(B + '/show', 1); c.subscribe(B + '/now', 1); c.subscribe(B + '/x');
      if (S.now && S.now.k === 'poll') c.subscribe(B + '/v/' + S.now.id + '/+', 1);
    }
    C.brokers.forEach(function (url) {
      var L = { c: null, wait: 2000, r: -1 };
      function open() {
        var c = new TasMQ(url, {
          onConnect: function () {
            L.wait = 2000; L.r = -1; subsFor(c); changed(); pushStats(); pushPR();
            // a broker that missed the last Reset learns about it now
            setTimeout(function () { if (c.ok && (L.r < S.db.at || L.r === -1)) pushRound(L); }, 2500);
          },
          onMessage: function (t, x) { onMsg(t, x, L); },
          onClose: function () { changed(); setTimeout(open, L.wait); L.wait = Math.min(L.wait * 2, 30000); }
        });
        L.c = c; c.connect();
      }
      open(); links.push(L);
    });
    function up() { return links.filter(function (L) { return L.c && L.c.ok; }).length; }
    function pub(topic, text, o) { links.forEach(function (L) { if (L.c && L.c.ok) L.c.publish(topic, text, o || {}).catch(function () {}); }); }
    function pushRound(L) { L.c.publish(B + '/r', JSON.stringify({ id: S.db.round, at: S.db.at }), { qos: 1, retain: true }).catch(function () {}); L.r = Math.max(L.r, S.db.at); }

    // ---- incoming
    function json(x) { try { return JSON.parse(x); } catch (e) { return null; } }
    function onMsg(t, x, L) {
      if (t === B + '/x') return onReact(x);
      if (t.indexOf(B + '/c/') === 0) return onAnswer(t.slice(B.length + 3), x);
      if (t.indexOf(B + '/q/') === 0) return onQuestion(t.slice(B.length + 3), x);
      if (t.indexOf(B + '/v/') === 0) { var p = t.slice(B.length + 3).split('/'); return onVote(p[0], p[1], x); }
      if (t === B + '/show') { if (x !== S.show) { S.show = x; changed(); } return; }
      if (t === B + '/now') return onNow(x);
      if (t === B + '/r') {
        var d = json(x); if (!d) return;
        var at = +d.at || 0, id = d.id != null ? String(d.id) : String(at);
        L.r = Math.max(L.r, at);
        if (at > S.db.at) {
          S.db = { seen: {}, round: id, at: at }; S.votes = {}; recount(); recountPoll();
          links.forEach(function (x2) { if (x2.c && x2.c.ok) x2.c.subscribe(B + '/c/+', 1); });   // ask again for the kept answers
        }
      }
    }
    function onReact(x) {
      String(x).split(',').forEach(function (p) {
        var m = /^([a-z]+):(\d+)$/.exec(p.trim());
        if (m && S.rx.hasOwnProperty(m[1])) S.rx[m[1]] += Math.min(+m[2], 5);
      });
      if (opt.onReact) opt.onReact(x);
      changed();
    }
    function onAnswer(id, x) {
      if (!/^[a-z0-9]{12,40}$/.test(id) || !x) return;
      var d = json(x);
      if (!d || !ROLE[d.r] || typeof d.t !== 'number') return;
      if ((d.g == null ? '0' : String(d.g)) !== S.db.round) return;
      var old = S.db.seen[id];
      if (old && (old.t > d.t || (old.r === d.r && old.t === d.t))) return;
      S.db.seen[id] = { r: d.r, t: d.t };
      recount();
    }
    function onQuestion(id, x) {
      if (!/^[a-z0-9]{12,60}$/.test(id)) return;
      if (!x) { delete S.qs[id]; return changed(); }
      var d = json(x);
      if (!d || typeof d.q !== 'string' || !d.q.trim()) return;
      S.qs[id] = { q: d.q.slice(0, 280), t: +d.t || Date.now(), g: d.g == null ? '0' : String(d.g) };
      changed();
    }
    function onNow(x) {
      var d = json(x) || { k: 'none', at: 0 };
      var at = +d.at || 0;
      if (S.now && at < S.now.at) return;              // an older state from a broker that missed a change
      if (d.k === 'poll' && d.id && Array.isArray(d.o)) {
        if (!S.now || S.now.id !== d.id) {
          S.votes = {};
          links.forEach(function (L) { if (L.c && L.c.ok) L.c.subscribe(B + '/v/' + d.id + '/+', 1); });
        }
        S.now = { k: 'poll', id: String(d.id), q: String(d.q || ''), o: d.o.map(String).slice(0, 6), open: !!d.open, at: at };
      } else S.now = { k: 'none', at: at };
      recountPoll();
    }
    function onVote(pid, dev, x) {
      if (!S.now || S.now.k !== 'poll' || pid !== S.now.id || !/^[a-z0-9]{12,40}$/.test(dev || '')) return;
      if (!x) { delete S.votes[dev]; return recountPoll(); }
      var d = json(x);
      if (!d || typeof d.o !== 'number' || d.o < 0 || d.o >= S.now.o.length) return;
      if ((d.g == null ? '0' : String(d.g)) !== S.db.round) return;
      var old = S.votes[dev];
      if (old && old.t >= d.t) return;
      S.votes[dev] = { o: d.o, t: +d.t || 0 };
      recountPoll();
    }

    // ---- counting
    var statT = null, prT = null;
    function recount() {
      var c = {}, total = 0;
      for (var id in S.db.seen) { var r = S.db.seen[id].r; c[r] = (c[r] || 0) + 1; total++; }
      S.counts = c; S.total = total;
      store();
      if (!statT) statT = setTimeout(pushStats, 1000);
      changed();
    }
    function recountPoll() {
      var n = [], total = 0;
      if (S.now && S.now.k === 'poll') {
        n = S.now.o.map(function () { return 0; });
        for (var d in S.votes) { n[S.votes[d].o]++; total++; }
      }
      S.pollCounts = n; S.pollTotal = total;
      if (!prT) prT = setTimeout(pushPR, 800);
      changed();
    }
    function pushStats() { statT = null; pub(B + '/s', JSON.stringify({ n: S.total, g: S.db.round, t: Date.now() }), { retain: true }); }
    function pushPR() {
      prT = null;
      if (!S.now || S.now.k !== 'poll') return;
      pub(B + '/pr', JSON.stringify({ id: S.now.id, n: S.pollCounts, total: S.pollTotal, t: Date.now() }), { retain: true });
    }
    recount();

    // ---- actions (host panel)
    function rid() { return Math.random().toString(36).slice(2, 10); }
    function setNow(n) {
      n.at = Math.max(Date.now(), (S.now ? S.now.at : 0) + 1);
      pub(B + '/now', JSON.stringify(n), { qos: 1, retain: true });
      onNow(JSON.stringify(n));
    }
    function clearVotes() {
      if (!S.now || S.now.k !== 'poll') return;
      var pid = S.now.id;
      Object.keys(S.votes).forEach(function (dev) { pub(B + '/v/' + pid + '/' + dev, '', { retain: true }); });
    }
    var api = {
      state: S,
      up: up,
      links: links.length,
      // Reset: a new round — check-ins, questions, the poll and the question on the screen start from zero; phones go back to check-in
      reset: function () {
        var ids = Object.keys(S.db.seen);
        clearVotes();
        Object.keys(S.qs).forEach(function (id) { pub(B + '/q/' + id, '', { retain: true }); });
        ids.forEach(function (id) { pub(B + '/c/' + id, '', { retain: true }); });
        S.db = { seen: {}, round: rid(), at: Date.now() };
        S.qs = {}; S.done = {}; S.votes = {};
        links.forEach(function (L) { if (L.c && L.c.ok) pushRound(L); });
        pub(B + '/show', '', { qos: 1, retain: true }); S.show = '';
        setNow({ k: 'none' });
        clearTimeout(statT); statT = null;
        recount(); pushStats();
      },
      startPoll: function (q, o) {
        clearVotes();
        setNow({ k: 'poll', id: 'p' + rid(), q: q, o: o, open: true });
      },
      closePoll: function () { if (S.now && S.now.k === 'poll') setNow({ k: 'poll', id: S.now.id, q: S.now.q, o: S.now.o, open: false }); },
      reopenPoll: function () { if (S.now && S.now.k === 'poll') setNow({ k: 'poll', id: S.now.id, q: S.now.q, o: S.now.o, open: true }); },
      endPoll: function () { clearVotes(); setNow({ k: 'none' }); },
      showQuestion: function (text) { S.show = text; pub(B + '/show', text, { qos: 1, retain: true }); changed(); },
      doneQuestion: function (id) {
        var q = S.qs[id];
        S.done[id] = 1; store();
        if (q && S.show === q.q) api.showQuestion('');
        pub(B + '/q/' + id, '', { qos: 1, retain: true });
        changed();
      },
      questions: function () {                         // current round, newest first
        return Object.keys(S.qs).filter(function (id) { return !S.done[id] && S.qs[id].g === S.db.round; })
          .sort(function (a, b) { return S.qs[b].t - S.qs[a].t; }).map(function (id) { return { id: id, q: S.qs[id].q, t: S.qs[id].t }; });
      }
    };
    setInterval(changed, 2000);                         // status and "2 min ago" stay right
    return api;
  };
})();
</script>
<script>
(function () {
  var C = window.TAS3D_CHECKIN;
  var Q = new URLSearchParams(location.search);
  var DEMO = Q.has('demo');
  var $ = function (id) { return document.getElementById(id); };
  var EMO = {}; C.reactions.forEach(function (r) { EMO[r[0]] = r[1]; });

  // ---- check-in rows
  var rows = {};
  C.roles.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="nm"></span><span class="bar"><i></i></span><span class="n">0</span><span class="pc">0%</span>';
    d.querySelector('.nm').textContent = r[1];
    $('rows').appendChild(d);
    rows[r[0]] = { el: d, bar: d.querySelector('.bar i'), n: d.querySelector('.n'), pc: d.querySelector('.pc'), v: 0 };
  });

  // ---- big number with flip-board digits
  var shown = '';
  function setTotal(n) {
    var s = String(n), el = $('total');
    if (s === shown) return;
    var pad = Math.max(s.length, shown.length), a = s.padStart(pad, ' '), b = shown.padStart(pad, ' ');
    el.innerHTML = '';
    for (var i = 0; i < pad; i++) {
      if (a[i] === ' ') continue;
      var sp = document.createElement('span'); sp.textContent = a[i];
      if (shown && a[i] !== b[i]) sp.className = 'flip';
      el.appendChild(sp);
    }
    shown = s;
  }
  function bars(list, counts, total) {             // list: [{el,bar,n,pc,v}]
    var max = 0; counts.forEach(function (v) { if (v > max) max = v; });
    list.forEach(function (o, i) {
      var v = counts[i] || 0;
      if (v > o.v) { o.el.classList.remove('bump'); void o.el.offsetWidth; o.el.classList.add('bump'); }
      o.v = v; o.n.textContent = v;
      o.pc.textContent = (total ? Math.round(v / total * 100) : 0) + '%';
      o.bar.style.width = (max ? v / max * 100 : 0) + '%';
      o.el.classList.toggle('lead', max > 0 && v === max);
    });
  }

  // ---- poll rows (rebuilt for each poll)
  var pollId = '', prow = [];
  function pollRows(p) {
    if (pollId === p.id) return;
    pollId = p.id; prow = []; $('pRows').innerHTML = '';
    p.o.forEach(function (o) {
      var d = document.createElement('div'); d.className = 'row';
      d.innerHTML = '<span class="nm"></span><span class="bar"><i></i></span><span class="n">0</span><span class="pc">0%</span>';
      d.querySelector('.nm').textContent = o;
      $('pRows').appendChild(d);
      prow.push({ el: d, bar: d.querySelector('.bar i'), n: d.querySelector('.n'), pc: d.querySelector('.pc'), v: 0 });
    });
  }

  // ---- reactions: a steady stream, about 14 per second; the rest are dropped
  var queue = [], alive = 0;
  function onReact(text) {
    String(text).split(',').forEach(function (p) {
      var m = /^([a-z]+):(\d+)$/.exec(p.trim());
      if (!m || !EMO[m[1]]) return;
      for (var i = 0; i < Math.min(+m[2], 5); i++) queue.push(m[1]);
    });
    if (queue.length > 40) queue.splice(0, queue.length - 40);
  }
  setInterval(function () {
    if (!queue.length || alive >= 90) return;
    var e = document.createElement('span');
    e.className = 'rx'; e.textContent = EMO[queue.shift()];
    e.style.left = (74 + Math.random() * 21) + 'vw';
    e.style.setProperty('--s', (Math.random() * 6 - 3).toFixed(2) + 'vw');
    e.style.setProperty('--d', (3.1 + Math.random() * 1.3).toFixed(2) + 's');
    alive++; document.body.appendChild(e);
    e.addEventListener('animationend', function () { e.remove(); alive--; });
  }, 70);

  // ---- the question card
  var cur = null;
  function showCard(text) {
    if (text === cur) return;
    cur = text;
    var card = $('card');
    if (!text) return card.classList.remove('on');
    if (card.classList.contains('on')) {
      card.classList.remove('on');
      setTimeout(function () { if (cur === text) { $('cardT').textContent = text; card.classList.add('on'); } }, 450);
    } else { $('cardT').textContent = text; card.classList.add('on'); }
  }

  function render(S, up) {
    var p = S.now && S.now.k === 'poll' ? S.now : null;
    $('vCheck').hidden = !!p; $('vPoll').hidden = !p;
    $('qrH').textContent = p && p.open ? 'Vote' : 'Check in';
    $('qrP').textContent = p && p.open ? 'Open the TAS3D page on your phone — the poll is there' : 'Point your phone camera at the QR code';
    if (p) {
      pollRows(p);
      $('pK').textContent = p.open ? 'Poll · voting open' : 'Poll · voting closed';
      $('pQ').textContent = p.q;
      bars(prow, S.pollCounts, S.pollTotal);
      $('pN').textContent = S.pollTotal + (S.pollTotal === 1 ? ' vote' : ' votes');
    } else {
      setTotal(S.total);
      bars(C.roles.map(function (r) { return rows[r[0]]; }), C.roles.map(function (r) { return S.counts[r[0]] || 0; }), S.total);
    }
    showCard(S.show);
    var ok = DEMO || up > 0;
    $('live').classList.toggle('off', !ok);
    $('liveT').textContent = DEMO ? 'Demo' : ok ? 'Live' : 'No connection';
  }

  // ---- controls
  function toggleQr() { var on = document.documentElement.classList.toggle('noqr'); $('bQr').setAttribute('aria-pressed', on ? 'false' : 'true'); }
  function fullscreen() {
    var d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var e = d.documentElement; (e.requestFullscreen || e.webkitRequestFullscreen).call(e); }
  }
  $('bQr').addEventListener('click', toggleQr);
  $('bFs').addEventListener('click', fullscreen);
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || !$('login').hidden) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'q' || k === 'й') toggleQr();
    else if (k === 'f' || k === 'а') fullscreen();
  });
  var idleT;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 2500); }
  document.addEventListener('mousemove', wake);
  if (Q.get('qr') === '0') toggleQr();
  function keepAwake() { try { if (navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', keepAwake);

  function go() {
    $('stage').hidden = false; $('ctl').hidden = false; wake(); keepAwake();
    if (DEMO) return demo();
    var hub = TasHub(function (S) { render(S, hub.up()); }, { onReact: onReact });
    render(hub.state, 0);
  }
  if (DEMO) go(); else TasAuth.gate(go);

  // ---- demo: simulated guests and reactions (rehearsal, screenshots): ?demo&n=180&still, &poll, &q=text
  function demo() {
    var W = { vis: 26, arch: 30, dev: 7, stud: 24, teach: 6, other: 7 }, c = {}, n = 0;
    C.roles.forEach(function (x) { c[x[0]] = 0; });
    var keys = C.roles.map(function (r) { return r[0]; });
    function add() { var p = Math.random() * 100, k = keys[keys.length - 1]; for (var i = 0; i < keys.length; i++) { p -= W[keys[i]]; if (p <= 0) { k = keys[i]; break; } } c[k]++; n++; }
    for (var i = 0; i < (+Q.get('n') || 0); i++) add();
    var S = { total: n, counts: c, now: null, pollCounts: [], pollTotal: 0, show: Q.get('q') || '' };
    if (Q.has('poll')) { var pp = C.polls[1]; S.now = { k: 'poll', id: 'demo', q: pp[0], o: pp[1], open: true }; S.pollCounts = [41, 37, 52, 18, 23, 9]; S.pollTotal = 180; }
    render(S, 1);
    if (!Q.has('still')) setInterval(function () { add(); S.total = n; render(S, 1); }, 900);
    var rk = Object.keys(EMO);
    setInterval(function () { onReact(rk[Math.floor(Math.random() * rk.length)] + ':' + (1 + Math.floor(Math.random() * 3))); }, 450);
  }
})();
</script>
</body>
